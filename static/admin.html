<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS — Admin</title>
<!-- ... (CSS remains exactly the same, I'm omitting it here to keep it short, see below) ... -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Menlo', 'Courier New', monospace; background: #0a0e14; color: #c9d1d9; min-height: 100vh; font-size: 14px; }
  .hidden { display: none !important; }
  #login-view { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-card { background: #131820; border: 1px solid #2d3542; border-radius: 8px; padding: 32px; max-width: 380px; width: 100%; }
  .login-card h1 { font-size: 20px; color: #58a6ff; margin-bottom: 8px; }
  .login-card p { color: #768390; margin-bottom: 24px; font-size: 13px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; color: #8b949e; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input, .field select { width: 100%; background: #0a0e14; border: 1px solid #2d3542; color: #c9d1d9; padding: 10px 12px; border-radius: 4px; font-family: inherit; font-size: 14px; }
  .field input:focus { outline: none; border-color: #58a6ff; }
  button { background: #238636; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-family: inherit; font-size: 13px; cursor: pointer; font-weight: 600; }
  button:hover { background: #2ea043; }
  button:disabled { background: #2d3542; cursor: not-allowed; }
  .btn-block { width: 100%; }
  .btn-ghost { background: transparent; border: 1px solid #2d3542; color: #8b949e; }
  .btn-ghost:hover { background: #131820; color: #c9d1d9; }
  .error { background: #67060c; color: #ffdcd7; padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
  #dashboard-view { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #2d3542; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 18px; color: #58a6ff; }
  .nav-tabs { display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid #2d3542; padding-bottom: 8px; overflow-x: auto; }
  .nav-tab { color: #768390; cursor: pointer; padding: 4px 8px; font-size: 14px; white-space: nowrap; }
  .nav-tab.active { color: #58a6ff; border-bottom: 2px solid #58a6ff; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: #131820; border: 1px solid #2d3542; border-radius: 8px; padding: 16px; }
  .card .label { color: #768390; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .card .value { font-size: 28px; color: #c9d1d9; font-weight: 700; }
  .section { background: #131820; border: 1px solid #2d3542; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  .section h2 { font-size: 14px; color: #c9d1d9; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
  .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  th { text-align: left; color: #768390; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; border-bottom: 1px solid #2d3542; font-weight: normal; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #131820; white-space: nowrap; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-created { background: #1f2937; color: #9ca3af; }
  .status-pickup_assigned { background: #422006; color: #f0883e; }
  .loading { text-align: center; color: #768390; padding: 20px; }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <h1>CMS · Admin</h1>
    <p>Courier Management System</p>
    <div id="login-error" class="error hidden"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" required></div>
      <button type="submit" class="btn-block" id="login-btn">Sign In</button>
    </form>
  </div>
</div>

<div id="dashboard-view" class="hidden">
  <div class="header">
    <h1>CMS · Admin</h1>
    <div class="header-actions"><button class="btn-ghost" onclick="logout()">Logout</button></div>
  </div>
  <div class="nav-tabs">
    <div class="nav-tab active" id="nav-btn-dashboard" onclick="switchTab('dashboard')">Dashboard</div>
    <div class="nav-tab" id="nav-btn-shipments" onclick="switchTab('shipments')">Shipments</div>
    <div class="nav-tab" id="nav-btn-customers" onclick="switchTab('customers')">Customers</div>
    <div class="nav-tab" id="nav-btn-riders" onclick="switchTab('riders')">Riders</div>
  </div>
  <div id="tab-content-dashboard">
    <div class="section"><h2>Dashboard Loaded!</h2></div>
  </div>
  <div id="tab-content-shipments" class="hidden">
    <div class="section"><h2>Shipments Loaded!</h2></div>
  </div>
  <div id="tab-content-customers" class="hidden">
    <div class="section"><h2>Customers Loaded!</h2></div>
  </div>
  <div id="tab-content-riders" class="hidden">
    <div class="section"><h2>Riders Loaded!</h2></div>
  </div>
</div>

<script>
alert("1. Script started running");

const API = "";
const TOKEN_KEY = "cms_admin_token";

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(token) { localStorage.setItem(TOKEN_KEY, token); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function showLogin() {
  document.getElementById("login-view").classList.remove("hidden");
  document.getElementById("dashboard-view").classList.add("hidden");
}
function showDashboard() {
  document.getElementById("login-view").classList.add("hidden");
  document.getElementById("dashboard-view").classList.remove("hidden");
}

function switchTab(tabName) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const btn = document.getElementById('nav-btn-' + tabName);
  if (btn) btn.classList.add('active');
  
  document.querySelectorAll('[id^="tab-content-"]').forEach(el => el.classList.add('hidden'));
  const content = document.getElementById('tab-content-' + tabName);
  if (content) content.classList.remove('hidden');
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  alert("2. Sign In button clicked!");
  
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("login-btn");
  const errEl = document.getElementById("login-error");
  
  btn.disabled = true; btn.textContent = "Signing in…";
  errEl.classList.add("hidden");
  
  try {
    alert("3. About to send fetch request to /auth/login");
    const body = new URLSearchParams();
    body.append("username", email);
    body.append("password", password);
    
    const res = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
    });
    
    alert("4. Fetch returned status: " + res.status);
    
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || "Login failed");
    }
    
    const data = await res.json();
    alert("5. Login successful, token received!");
    
    setToken(data.access_token);
    showDashboard();
    switchTab('dashboard');
    
  } catch (err) {
    alert("ERROR: " + err.message);
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  } finally {
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

function logout() {
  clearToken();
  showLogin();
}

(function init() {
  alert("6. Init function started");
  if (getToken()) {
    showDashboard();
    switchTab('dashboard');
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
